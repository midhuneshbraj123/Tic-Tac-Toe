<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="spaceCanvas"></canvas>

  <h1>Tic Tac Toe</h1>

  <div class="rules-container">
    <h2>How to Play</h2>
    <ol class="rules-list">
      <li>You are <strong>X</strong>, Computer is <strong>O</strong>.</li>
      <li>Click any empty box to make a move.</li>
      <li>Get 3 in a row horizontally, vertically, or diagonally to win!</li>
    </ol>
  </div>

  <div id="board" class="board">
    <div class="cell" data-index="0"></div>
    <div class="cell" data-index="1"></div>
    <div class="cell" data-index="2"></div>
    <div class="cell" data-index="3"></div>
    <div class="cell" data-index="4"></div>
    <div class="cell" data-index="5"></div>
    <div class="cell" data-index="6"></div>
    <div class="cell" data-index="7"></div>
    <div class="cell" data-index="8"></div>
  </div>

  <button id="restartButton">Restart Game</button>

  <div class="controls-container"
    <div class="difficulty-select"
      <label for="difficulty">Select Difficulty:</label>
      <select id="difficulty">
        <option value="easy">Easy</option>
        <option value="medium" selected>Medium</option>
        <option value="hard">Hard</option>
      </select>
    </div>
  </div>


<div id="winnerModal" class="modal">
  <div class="modal-content">
    <h2 id="winnerText"></h2>
    <button id="modalRestartBtn" type="button">Play Again</button>
  </div>
</div>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
