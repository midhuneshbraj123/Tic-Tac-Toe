<!DOCTYPE html>
<html>
<head>
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Tic Tac Toe</h1>

    <button id="box1" onclick="play(1)"></button>
    <button id="box2" onclick="play(2)"></button>
    <button id="box3" onclick="play(3)"></button>
    <br>
    <button id="box4" onclick="play(4)"></button>
    <button id="box5" onclick="play(5)"></button>
    <button id="box6" onclick="play(6)"></button>
    <br>
    <button id="box7" onclick="play(7)"></button>
    <button id="box8" onclick="play(8)"></button>
    <button id="box9" onclick="play(9)"></button>

    <p id="status">Your turn</p>
    <button id="reset" onclick="resetGame()">Reset</button>

    <script src="script.js"></script>
</body>
</html>
